name: Update Art Catalog

on:
  schedule:
    - cron: '0 20 * * 1'  # Every Monday at noon Pacific (UTC-8 = 20:00 UTC)
  workflow_dispatch:        # Also allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run catalog generator
        env:
          SEATABLE_API_TOKEN: ${{ secrets.SEATABLE_API_TOKEN }}
        run: |
          python3 generate_catalog.py config_produced_works.json
          python3 generate_catalog.py config_currently_showing.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.html showing.html images/
          git diff --staged --quiet || git commit -m "Auto-update catalog $(date +'%Y-%m-%d')"
          git push
